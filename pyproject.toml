[project]
name = "faim-fractal-converters"
requires-python = ">= 3.11"
authors = [{ name = "Jan Eglinger", email = "jan.eglinger@fmi.ch" }]
dependencies = []
dynamic = ["version"]

[dependency-groups]
dev = [
  "fractal-task-tools>=0.5.0,<0.6",
  "pytest>=9.1.0,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.15.17,<0.16"
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
faim_fractal_converters = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
create-manifest = { cmd = [
  "fractal-manifest",
  "create",
  "--package",
  "faim-fractal-converters",
] }
test = "pytest --cov=src --cov-report term-missing"

[tool.pixi.tasks]
