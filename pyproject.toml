[project]
name = "faim-fractal-converters"
requires-python = ">= 3.11"
authors = [{ name = "Jan Eglinger", email = "jan.eglinger@fmi.ch" }]
dependencies = [
  "fractal-task-tools>=0.5.0,<0.6",
  "ome-zarr-converters-tools>=1.1.1,<2",
  "ome2xarray>=0.8.0,<0.9",
  "loguru>=0.7.3,<0.8",
  "metamorph-mda-parser>=0.3.0,<0.4",
  "cyclopts>=5.2.0,<6",
]
dynamic = ["version"]

[project.scripts]
convert = "faim_fractal_converters.cli:main"

[dependency-groups]
dev = [
  "hatch>=1.17.0,<2",
  "pytest>=9.1.0,<10",
  "pytest-cov>=7.1.0,<8",
  "hatch-vcs>=0.5.0,<0.6",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
faim_fractal_converters = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "py311" }
jupyter = { features = ["jupyter", "dev"], solve-group = "py311" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }
py314 = { features = ["py314", "dev"], solve-group = "py314" }

[tool.pixi.feature.dev.tasks]
create-manifest = { cmd = [
  "fractal-manifest",
  "create",
  "--package",
  "faim-fractal-converters",
] }
test = "pytest --cov=src --cov-report term-missing"

[tool.pixi.feature.jupyter.dependencies]
jupyter = ">=1.1.1,<2"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.tasks]

[tool.pixi.dependencies]
ngio = ">=1.1.3,<2"
pydantic = "<2.13"
dask = ">=2025.10.0,<2026"
ome-types = ">=0.6.3,<0.7"
xarray = ">=2026.4.0,<2027"
tifffile = ">=2026.3.3,<2027"
s3fs = ">=2026.4.0,<2027"
toml = ">=0.10.2,<0.11"
tqdm = ">=4.68.2,<5"
metamorph-mda-parser = ">=0.3.0,<0.4"
cyclopts = ">=5.2.0,<6"
