[project]
name = "faim-fractal-converters"
requires-python = ">= 3.11"
authors = [{ name = "Jan Eglinger", email = "jan.eglinger@fmi.ch" }]
dependencies = [
  "fractal-task-tools>=0.5.0,<0.6",
  "ome-zarr-converters-tools>=1.0.1,<2",
  "ome2xarray>=0.8.0,<0.9",
  "loguru>=0.7.3,<0.8"
]
dynamic = ["version"]

[dependency-groups]
dev = [
  "hatch>=1.17.0,<2",
  "pytest>=9.1.0,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.15.17,<0.16"
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
faim_fractal_converters = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
jupyter = { features = ["jupyter", "dev"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
create-manifest = { cmd = [
  "fractal-manifest",
  "create",
  "--package",
  "faim-fractal-converters",
] }
test = "pytest --cov=src --cov-report term-missing"

[tool.pixi.feature.jupyter.dependencies]
jupyter = ">=1.1.1,<2"

[tool.pixi.tasks]

[tool.pixi.dependencies]
ngio = ">=0.5.12,<0.6"
pydantic = "<2.13"
dask = ">=2025.10.0,<2026"
ome-types = ">=0.6.3,<0.7"
xarray = ">=2026.4.0,<2027"
tifffile = ">=2026.6.1,<2027"
s3fs = ">=2026.4.0,<2027"
toml = ">=0.10.2,<0.11"
tqdm = ">=4.68.2,<5"
